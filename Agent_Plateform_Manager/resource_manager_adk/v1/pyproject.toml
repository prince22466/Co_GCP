[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-manager-adk"
version = "1.0.0"
description = "Version 1 Google ADK agent for the Agentic Cloud Resource Manager experiment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.133,<1.0",
    "google-adk>=2.7.1,<3.0.0",
    "google-cloud-compute>=1.49,<2.0",
    "google-cloud-monitoring>=2.31,<3.0",
    "google-cloud-storage>=3.5,<4.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["resource_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
