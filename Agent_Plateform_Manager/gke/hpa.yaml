apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arm-web
  namespace: arm-stage1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arm-web
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
